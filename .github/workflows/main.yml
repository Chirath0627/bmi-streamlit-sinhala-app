name: Build & Deploy Streamlit BMI App to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clone repo if it doesn't exist, otherwise hard reset and pull latest changes
            if [ ! -d "bmi-calculator" ]; then
              git clone https://github.com/YOUR-GITHUB-USERNAME/YOUR-REPO-NAME.git bmi-calculator
              cd bmi-calculator
            else
              cd bmi-calculator
              git fetch --all
              git reset --hard origin/main
            fi

            # 2. Stop and remove the existing container
            docker stop bmi-app || true
            docker rm bmi-app || true

            # 3. Build a fresh Docker image without cache and run the container
            docker build --no-cache -t bmi-app .
            docker run -d -p 8501:8501 --name bmi-app --restart always bmi-app