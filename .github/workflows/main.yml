name: Build & Deploy Streamlit BMI App to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. If does not clone EC2, then Clone EC2 either Pull it 
            if [ ! -d "bmi-calculator" ]; then
              git clone https://github.com/Chirath0627/bmi-streamlit-sinhala-app.git bmi-calculator
              cd bmi-calculator
            else
              cd bmi-calculator
              git pull origin main
            fi

            # 2. Stop old container and remove it
            docker stop bmi-app || true
            docker rm bmi-app || true

            # 3. Build new docker image and run it in 8501
            docker build -t bmi-app .
            docker run -d -p 8501:8501 --name bmi-app --restart always bmi-app